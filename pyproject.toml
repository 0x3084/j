[project]
name = "qrs"
version = "0.1.0"
description = "Quantitative trading research system: data, backtesting, validation, paper trading"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0", "pandas>=2.2", "polars>=1.0", "pyarrow>=15", "duckdb>=1.0",
  "scipy>=1.12", "statsmodels>=0.14", "scikit-learn>=1.4", "lightgbm>=4.0",
  "httpx>=0.27", "pyyaml>=6", "fastapi>=0.110", "uvicorn>=0.29",
]
[project.optional-dependencies]
dev = ["pytest>=8"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["qrs*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
