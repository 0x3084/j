name: tests
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -e .[dev] exchange_calendars
      # data-dependent look-ahead tests skip automatically when data/processed is absent
      - run: pytest -q
