<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Nya bolag i ditt område{% endblock %}</title>
<style>
  :root { --fg:#1b1f24; --muted:#5b6470; --bg:#fbfbfa; --card:#fff; --line:#e3e5e8; --accent:#1f5f8b; }
  @media (prefers-color-scheme: dark) { :root { --fg:#e8eaed; --muted:#a3abb5; --bg:#15181c; --card:#1d2126; --line:#2e343b; --accent:#6fb1e0; } }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--fg); background:var(--bg); }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.9rem; line-height:1.2; margin: 0 0 12px; }
  h2 { font-size: 1.2rem; margin: 32px 0 8px; }
  p.lead { color: var(--muted); font-size: 1.08rem; }
  .card { background: var(--card); border:1px solid var(--line); border-radius: 10px; padding: 20px; margin: 16px 0; }
  label { display:block; font-weight:600; margin: 12px 0 4px; }
  input[type=text], input[type=email], textarea { width:100%; padding:10px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); font:inherit; }
  .hint { color: var(--muted); font-size: .9rem; }
  button { margin-top:16px; padding: 10px 18px; border:0; border-radius:6px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button.link { background:none; color:var(--accent); padding:0; margin:0; font-weight:400; }
  table { width:100%; border-collapse: collapse; font-size:.92rem; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
  .err { color:#b42318; font-weight:600; }
  .ok { color:#1a7f37; font-weight:600; }
  .price { font-size:1.5rem; font-weight:700; }
  .scroll { overflow-x:auto; }
  footer { color: var(--muted); font-size:.85rem; margin-top:48px; }
  a { color: var(--accent); }
</style>
</head>
<body><main>
{% block body %}{% endblock %}
<footer>Data: Bolagsverket, värdefulla datamängder (öppna data). Endast juridiska personer – inga enskilda firmor.</footer>
</main></body></html>
